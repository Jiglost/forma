/* Layout: single-column phone app. Sticky header, fixed bottom tab bar with an upward More menu,
   bottom sheets for tasks. Graphite + ivory surfaces, one teal accent, red reserved for alerts. */
:root {
  --bg: #f3f1eb; --surface: #fbfaf7; --surface-2: #e9e6de; --line: #d6d1c5;
  --fg: #1d2320; --fg-2: #454d49; --fg-3: #69706b;
  --ink: #1f2622; --ink-fg: #f3f1eb; --ink-2: #b9c0bb;
  --accent: #0c6b63; --accent-strong: #08524c; --accent-fg: #ffffff; --accent-soft: #d3e7e2;
  --warn: #855600; --warn-soft: #f4e6c8; --alert: #b0261d; --alert-soft: #f6dad6;
  --info-soft: #e6e8e4; --shadow: 0 1px 2px rgba(20,24,22,.06), 0 8px 24px rgba(20,24,22,.07);
  --f-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px; --tabh: 62px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --surface: #181d1b; --surface-2: #212826; --line: #2f3734;
  --fg: #ecebe5; --fg-2: #b6bcb8; --fg-3: #8b928d;
  --ink: #0a0d0c; --ink-fg: #ecebe5; --ink-2: #a3aaa5;
  --accent: #5cc2b5; --accent-strong: #84d6cb; --accent-fg: #0a1a18; --accent-soft: #17322e;
  --warn: #e6b85e; --warn-soft: #3a2f1c; --alert: #f0857b; --alert-soft: #3d211e;
  --info-soft: #222927; --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181d1b; --surface-2: #212826; --line: #2f3734;
  --fg: #ecebe5; --fg-2: #b6bcb8; --fg-3: #8b928d;
  --ink: #0a0d0c; --ink-fg: #ecebe5; --ink-2: #a3aaa5;
  --accent: #5cc2b5; --accent-strong: #84d6cb; --accent-fg: #0a1a18; --accent-soft: #17322e;
  --warn: #e6b85e; --warn-soft: #3a2f1c; --alert: #f0857b; --alert-soft: #3d211e;
  --info-soft: #222927; --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15.5px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, .h3 { font-family: var(--f-body); font-weight: 650; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h1 { font-family: var(--f-display); font-weight: 500; font-size: 2rem; letter-spacing: -.01em; font-variation-settings: "opsz" 96; }
h2 { font-size: 1.22rem; } h3, .h3 { font-size: 1.04rem; }
.display { font-family: var(--f-display); font-weight: 500; font-size: clamp(2rem, 8vw, 2.6rem); line-height: 1.05; letter-spacing: -.015em; font-variation-settings: "opsz" 120; }
.display em, .display-sm em { font-style: italic; color: var(--accent); font-weight: 400; }
.display-sm { font-family: var(--f-display); font-weight: 500; font-size: 1.6rem; line-height: 1.12; font-variation-settings: "opsz" 72; }
p { margin: 0; }
ul.tight { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; color: var(--fg-2); }
.num { font-variant-numeric: tabular-nums; }
.block { display: block; }
.pre { white-space: pre-wrap; }
.selectable { user-select: all; -webkit-user-select: all; }
.struck { text-decoration: line-through; color: var(--fg-3); }

.shell { max-width: 640px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; letter-spacing: -.01em; }
.mark .pl-stem { fill: var(--fg); } .mark .pl-top { fill: var(--accent); } .mark .pl-top-s { fill: var(--accent-strong); opacity: .55; } .mark .pl-mid { fill: var(--accent); opacity: .78; }
.top .sp { flex: 1; }
.status-pill { font-size: .72rem; color: var(--fg-3); display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-pill::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.status-pill.bad::before { background: var(--alert); } .status-pill.off::before { background: var(--warn); }
.main { padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 16px; outline: none; }
.eyebrow { font-size: .7rem; text-transform: uppercase; letter-spacing: .11em; color: var(--fg-3); font-weight: 650; }
.eyebrow.inv { color: var(--ink-2); }
.lede { color: var(--fg-2); }
.muted { color: var(--fg-3); } .small { font-size: .86rem; } .muted.small { font-size: .84rem; }
.today-head { display: flex; flex-direction: column; gap: 4px; padding: 6px 0 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; color: inherit; text-align: left; }
.card.hero { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.card.flat { background: transparent; }
.card.quiet { background: transparent; border-style: dashed; }
button.card { font: inherit; width: 100%; cursor: pointer; }
button.card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; } fieldset.card { border: 1px solid var(--line); padding: 12px; }
legend { padding: 0; }
.card-h { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }
.card-h > span:first-child, .card-h > div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
details > summary { cursor: pointer; list-style-position: outside; }
details.card > summary { padding: 2px 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } .grid3 { grid-template-columns: 1fr 1fr; } }

.hero-ink { background: var(--ink); color: var(--ink-fg); border-radius: 22px; padding: 22px 20px 24px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.hero-ink p { color: var(--ink-2); }
.hero-ink .display em { color: #7fd3c8; }
.hero-ink .hero-mark .pl-stem { fill: var(--ink-fg); }
.hero-ink::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; border: 1px solid rgba(127,211,200,.25); box-shadow: 0 0 0 28px rgba(127,211,200,.05); pointer-events: none; }

.btn { min-height: 46px; padding: 10px 16px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none; color: var(--fg); }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn:hover { border-color: color-mix(in srgb, var(--fg) 30%, var(--line)); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.danger { color: var(--alert); border-color: color-mix(in srgb, var(--alert) 60%, transparent); background: transparent; }
.btn.block { width: 100%; } .btn.left { justify-content: flex-start; text-align: left; }
.btn.lg { min-height: 54px; font-size: 1.02rem; }
.btn .muted-inv { opacity: .75; font-weight: 500; }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: .87rem; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.iconbtn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; color: var(--fg); }
.iconbtn.on { color: var(--accent); border-color: var(--accent); }
.iconbtn svg, .tabbar svg, .mi svg, .li-ic svg, .li > svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .73rem; font-weight: 650; padding: 3px 9px; border-radius: 999px; background: var(--info-soft); color: var(--fg-2); white-space: nowrap; }
.chip.ok { background: var(--accent-soft); color: var(--accent-strong); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.alert { background: var(--alert-soft); color: var(--alert); }
:root[data-theme="dark"] .chip.ok { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.ok { color: var(--accent); } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.choice { min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; text-align: left; }
.stack > .choice { border-radius: 12px; }
.choice[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.scale { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.scale .choice { width: 44px; padding: 0; text-align: center; border-radius: 12px; }

.note { border-radius: 13px; padding: 12px 14px; background: var(--info-soft); color: var(--fg-2); font-size: .9rem; display: flex; flex-direction: column; gap: 6px; }

.note.alert { background: var(--alert-soft); color: var(--fg); } .note.alert strong { color: var(--alert); }
.note.ok { background: var(--accent-soft); color: var(--fg); }

.f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fl { font-size: .86rem; font-weight: 650; color: var(--fg-2); }
.req { font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); font-weight: 650; margin-left: 4px; }
.f input, .f select, .f textarea, .in { min-height: 46px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-weight: 400; color: var(--fg); width: 100%; min-width: 0; font-size: 16px; }
.f textarea, textarea.in { min-height: 90px; resize: vertical; }
.f input[aria-invalid="true"] { border-color: var(--alert); }
.hint { font-weight: 400; color: var(--fg-3); font-size: .8rem; }

.check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; cursor: pointer; }

.why { font-size: .84rem; color: var(--accent); background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; min-height: 32px; }

/* typeable dropdown */
.combo { position: relative; display: flex; flex-direction: column; gap: 6px; }
.combo-in { position: relative; display: flex; }
.combo-in input { flex: 1; min-height: 46px; padding: 10px 44px 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); width: 100%; font-size: 16px; color: var(--fg); }
.combo-btn { position: absolute; right: 2px; top: 2px; bottom: 2px; width: 42px; border: 0; background: transparent; color: var(--fg-3); cursor: pointer; display: grid; place-items: center; }
.combo-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.combo-list { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0; max-height: 240px; overflow-y: auto; margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.combo-list li { padding: 11px 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.combo-list li[aria-selected="true"] { font-weight: 650; color: var(--accent); }
.combo-list li.active, .combo-list li:hover { background: var(--accent-soft); }
.combo-list li.none { color: var(--fg-3); cursor: default; }
.combo-list li.done-row { position: sticky; bottom: -4px; padding: 6px 4px 4px; background: var(--surface); cursor: default; }
.combo-list li.done-row:hover { background: var(--surface); }
.combo-list li.done-row button { width: 100%; min-height: 42px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 650; cursor: pointer; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 2px; background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 3px 4px 3px 11px; font-size: .86rem; font-weight: 550; }
.tag button { border: 0; background: transparent; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; color: var(--fg-2); font-size: 1.05rem; line-height: 1; }
.tag button:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }

.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; font: inherit; color: inherit; }
.li:first-child { border-top: 0; }
.li.col { flex-direction: column; align-items: stretch; gap: 6px; }
.li .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.li .title { font-weight: 600; overflow-wrap: anywhere; }
button.li.tap { cursor: pointer; border-radius: 0; }
button.li.tap:hover .title { color: var(--accent); }
.li-ic { color: var(--fg-3); display: inline-flex; }
.kv { display: grid; grid-template-columns: minmax(0, 40%) 1fr; gap: 6px 12px; font-size: .9rem; margin: 0; }
.kv dt { color: var(--fg-3); } .kv dd { margin: 0; overflow-wrap: anywhere; }
dl.kv.card { display: grid; }

.metrics { gap: 12px; }
.metric { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.metric b { font-family: var(--f-display); font-size: 1.55rem; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; font-variation-settings: "opsz" 48; overflow-wrap: anywhere; }
.metric span { font-size: .76rem; color: var(--fg-3); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.warn > i { background: var(--warn); } .bar.alert > i { background: var(--alert); }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar nav { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar button { height: var(--tabh); background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .71rem; font-weight: 650; color: var(--fg-3); cursor: pointer; }
.tabbar button[aria-current="page"], .tabbar button[aria-expanded="true"] { color: var(--accent); }
.menu-scrim { position: fixed; inset: 0; z-index: 31; background: rgba(10,12,11,.18); }
.moremenu { position: fixed; z-index: 32; right: max(10px, calc(50% - 310px)); bottom: calc(var(--tabh) + 10px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 20px)); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 50px rgba(10,12,11,.22); padding: 6px; display: flex; flex-direction: column; transform-origin: bottom right; animation: pop .16s ease-out; max-height: calc(100vh - var(--tabh) - 90px); overflow-y: auto; }
.mi { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 8px 12px; border: 0; border-radius: 12px; background: none; cursor: pointer; text-align: left; font-weight: 550; color: var(--fg); }
.mi svg { color: var(--fg-3); width: 20px; height: 20px; }
.mi:hover, .mi:focus-visible { background: var(--accent-soft); outline: none; }
@keyframes pop { from { transform: translateY(8px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }

.seg { display: flex; background: var(--surface-2); border-radius: 13px; padding: 3px; gap: 2px; overflow-x: auto; }
.seg.narrow { max-width: 260px; }
.seg button { flex: 1; min-height: 40px; border: 0; background: none; border-radius: 10px; font-weight: 650; font-size: .86rem; color: var(--fg-2); cursor: pointer; white-space: nowrap; padding: 0 10px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

.scrim { position: fixed; inset: 0; background: rgba(10,12,11,.45); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92vh; background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; animation: up .22s ease-out; box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-h h2 { flex: 1; font-size: 1.15rem; outline: none; }
.sheet-b { overflow-y: auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
@keyframes up { from { transform: translateY(26px); } to { transform: none; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabh) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--fg); color: var(--bg); border-radius: 13px; padding: 8px 8px 8px 14px; display: flex; gap: 6px; align-items: center; font-size: .9rem; max-width: calc(100% - 32px); width: max-content; box-shadow: var(--shadow); }
.toast.err { background: var(--alert); color: #fff; }
.toast.top { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; cursor: pointer; min-height: 36px; min-width: 36px; padding: 0 8px; }
.toast button:first-of-type:not(:last-child) { text-decoration: underline; }

.ob-head { display: flex; flex-direction: column; gap: 8px; }
.ob-nav { margin-top: 6px; }
.progress { height: 4px; background: var(--surface-2); border-radius: 9px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .dow { font-size: .7rem; color: var(--fg-3); font-weight: 650; padding-bottom: 2px; }
.cal button { aspect-ratio: 1; max-width: 100%; border: 1px solid transparent; border-radius: 11px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-variant-numeric: tabular-nums; font-size: .88rem; color: var(--fg); }
.cal button.out { opacity: .38; }
.cal button.today { border-color: var(--accent); }
.cal button.sel { background: var(--accent); color: var(--accent-fg); }
.dots { display: flex; gap: 2px; height: 5px; }
.dots i, .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); display: inline-block; }
.cal button.sel .dots i { background: var(--accent-fg); }
.dots i.l, .dot.l { background: var(--fg-3); } .dots i.a, .dot.a { background: var(--warn); }
.legend .dot { vertical-align: middle; margin-right: 2px; }

.set-row { display: grid; grid-template-columns: 26px 1fr 1fr 1fr 44px; gap: 6px; align-items: center; }
.set-row.head { font-size: .74rem; color: var(--fg-3); font-weight: 650; }
.set-row input { min-height: 42px; padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); width: 100%; min-width: 0; text-align: center; font-size: 16px; color: var(--fg); }
.set-row input[aria-invalid="true"] { border-color: var(--alert); }
.set-row .done { width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--fg-3); font-weight: 700; }
.set-row .done[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.timer { position: sticky; top: calc(62px + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--ink); color: var(--ink-fg); border-radius: 15px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.timer b { font-family: var(--f-display); font-size: 1.55rem; font-weight: 500; font-variant-numeric: tabular-nums; flex: 1; }
.timer button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 10px; min-height: 38px; padding: 0 12px; cursor: pointer; }

.chartfig { margin: 0; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--fg-3); font-size: 10px; font-family: var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .area { fill: var(--accent-soft); opacity: .8; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--accent); }
.chart .end { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.photos figure { margin: 0; aspect-ratio: 3/4; border-radius: 11px; overflow: hidden; background: var(--surface-2); position: relative; max-width: 100%; }
.photos img { width: 100%; height: 100%; object-fit: cover; }
.photos figcaption { position: absolute; bottom: 0; left: 0; right: 0; font-size: .7rem; padding: 3px 6px; background: rgba(0,0,0,.55); color: #fff; }
.ph-del { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 1.1rem; cursor: pointer; }
.blur img { filter: blur(16px); }
img.missing { min-height: 60px; }
.label-img { border-radius: 12px; border: 1px solid var(--line); max-height: 320px; object-fit: contain; background: var(--surface-2); }
.att { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; font-size: .88rem; }
.att img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.ai-msg { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 6px; }
.ai-msg.me { background: var(--accent-soft); border-color: transparent; align-self: flex-end; max-width: 90%; }
.sendpreview, pre.summary { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: .82rem; max-height: 260px; overflow: auto; margin: 6px 0 0; }
pre.summary { max-height: none; font-size: .84rem; margin: 0; }
.srcs { display: flex; flex-direction: column; gap: 5px; font-size: .88rem; }
.empty { padding: 4px 0; color: var(--fg-2); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.origin { font-size: .67rem; font-weight: 750; text-transform: uppercase; letter-spacing: .07em; }
.origin.user { color: var(--fg-3); } .origin.label { color: var(--warn); } .origin.missing { color: var(--alert); }
.skeleton { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tablewrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: .88rem; }
table.t th, table.t td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sample-banner { background: var(--warn-soft); color: var(--fg); font-size: .82rem; padding: 7px 16px; text-align: center; }
.sample-banner button { background: none; border: 0; color: var(--warn); font-weight: 700; text-decoration: underline; cursor: pointer; min-height: 32px; }

/* intro: the folded mark assembles, the wordmark rises */
.intro { position: fixed; inset: 0; z-index: 100; background: var(--ink); color: var(--ink-fg); display: grid; place-items: center; transition: opacity .35s ease; }
.intro.out { opacity: 0; pointer-events: none; }
.intro-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 24px; }
.intro .mark .pl-stem { fill: var(--ink-fg); }
.intro-word { font-family: var(--f-display); font-size: 2.6rem; font-weight: 500; letter-spacing: -.02em; }
.intro.quick .intro-word { font-size: 1.8rem; }
.intro-tag { color: var(--ink-2); font-size: .95rem; max-width: 28ch; }
.intro-skip { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; background: none; border: 1px solid rgba(255,255,255,.3); color: var(--ink-fg); border-radius: 999px; min-height: 40px; padding: 0 16px; cursor: pointer; font-weight: 600; }
.intro.full .pl-stem { animation: fold-in .7s cubic-bezier(.2,.8,.2,1) both; transform-origin: 16px 24px; }
.intro.full .pl-top, .intro.full .pl-top-s { animation: fold-arm .7s .35s cubic-bezier(.2,.8,.2,1) both; transform-origin: 21px 10px; }
.intro.full .pl-mid { animation: fold-arm .7s .55s cubic-bezier(.2,.8,.2,1) both; transform-origin: 21px 26px; }
.intro.full .intro-word { animation: rise .6s .85s ease-out both; }
.intro.full .intro-tag { animation: rise .6s 1.1s ease-out both; }
.intro.quick .intro-inner { animation: rise .35s ease-out both; }
@keyframes fold-in { from { transform: scaleY(.1); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fold-arm { from { transform: perspective(200px) rotateY(-80deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
.intro.still *, .intro.still { animation: none !important; transition: none !important; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (forced-colors: active) { .chip, .choice[aria-pressed="true"], .btn.primary { border: 1px solid CanvasText; } }

/* ---------- buddy layer ---------- */
.focus { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--fg-2); font-size: .95rem; margin-top: 4px; }
.card.week { flex-direction: row; align-items: center; gap: 16px; background: var(--ink); color: var(--ink-fg); border-color: transparent; }
.card.week .eyebrow { color: var(--ink-2); }
.week-ring { position: relative; flex: none; width: 92px; height: 92px; }
.ring-bg { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 9; }
.ring-fg { fill: none; stroke: #5cc2b5; stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray .6s ease; }
.ring-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.ring-num b { font-family: var(--f-display); font-size: 1.9rem; font-weight: 500; }

.week-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.week-msg { font-weight: 600; line-height: 1.3; }
.streaks { display: flex; flex-wrap: wrap; gap: 6px; }
.streak { display: inline-block; line-height: 1.35; font-size: .78rem; background: rgba(255,255,255,.08); border-radius: 999px; padding: 4px 10px 4px 7px; color: var(--ink-fg); }
.streak b { font-variant-numeric: tabular-nums; }
.streaks { flex-direction: column; align-items: flex-start; }
.flame, .dotc { vertical-align: -2px; margin-right: 5px; }
.flame { width: 12px; height: 15px; background: linear-gradient(180deg, #ffd27a, #ff8a3d); border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%; display: inline-block; }
.dotc { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #5cc2b5; display: inline-block; }
.readiness .score { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong); flex: none; }
.readiness .score b { font-family: var(--f-display); font-size: 1.35rem; font-weight: 500; }
.recap { gap: 8px; }
.recap-row { display: flex; gap: 18px; flex-wrap: wrap; }
.recap-row b { font-family: var(--f-display); font-size: 1.4rem; font-weight: 500; margin-right: 4px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.badge { border: 1px dashed var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 3px; opacity: .8; }
.badge.got { border-style: solid; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--accent-soft); opacity: 1; }
.b-ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; background: var(--surface-2); color: var(--fg-2); }
.badge.got .b-ic { background: var(--accent); color: var(--accent-fg); font-size: 1rem; }
.b-t { font-weight: 650; font-size: .9rem; } .b-d { font-size: .76rem; color: var(--fg-3); }
.medal { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #f6d985; color: #6b4b00; font-size: .9rem; flex: none; }
.pr-tag { display: inline-flex; gap: 4px; align-items: center; background: #f6d985; color: #5b3f00; border-radius: 999px; font-size: .75rem; font-weight: 700; padding: 3px 10px; }
svg.body { width: 100%; max-width: 360px; height: auto; display: block; margin: 0 auto; }
svg.body text { fill: var(--fg-3); font-size: 9px; font-family: var(--f-body); }
svg.body .head { fill: var(--surface-2); }
.st-fresh { fill: var(--surface-2); background: var(--surface-2); }
.st-recovering { fill: color-mix(in srgb, var(--accent) 45%, var(--surface-2)); background: color-mix(in srgb, var(--accent) 45%, var(--surface-2)); }
.st-worked { fill: var(--accent); background: var(--accent); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: middle; margin-right: 6px; flex: none; }
.legend.small { display: flex; flex-wrap: wrap; gap: 6px 14px; } .legend.small > span.lg { display: inline-flex; align-items: center; }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: .86rem; }
.mlist li { display: flex; flex-direction: column; } .mlist li .sw { margin: 0 6px 0 0; }
@media (max-width: 380px) { .mlist { grid-template-columns: 1fr; } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; background: #5cc2b5; animation: fall 1.4s cubic-bezier(.2,.6,.4,1) forwards; }
.confetti i:nth-child(3n) { background: #f6d985; } .confetti i:nth-child(3n+1) { background: #ff8a3d; width: 6px; }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .9; } }
.done-hero { display: flex; align-items: center; gap: 12px; }
.plates { display: flex; align-items: center; gap: 4px; min-height: 92px; padding: 8px; background: var(--surface-2); border-radius: 12px; overflow-x: auto; }
.plate { display: grid; place-items: center; width: 26px; border-radius: 5px; color: #fff; font-size: .7rem; font-weight: 700; background: #3a4440; height: 60px; flex: none; }
.plate.p45, .plate.p25 { height: 84px; background: #2c5f8a; } .plate.p35, .plate.p20 { height: 78px; background: #b38a1a; } .plate.p15 { height: 72px; background: #3e7d4f; }
.plate.p10 { height: 64px; background: #4a4f55; } .plate.p5 { height: 52px; background: #8a2e2e; } .plate.p2_5, .plate.p1_25 { height: 42px; width: 20px; background: #6b6f73; }
.oauth { gap: 10px; }
.oauth.apple { background: #000; color: #fff; border-color: #000; }
.oauth.apple span::before { content: ""; }
.oauth .g { font-weight: 800; color: #4285f4; }
.or { display: flex; align-items: center; gap: 10px; color: var(--fg-3); font-size: .8rem; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.card.auth { gap: 12px; }

/* iOS Safari renders date/time inputs wider than their container; keep them inside and full-width. */
input[type="date"], input[type="time"], input[type="datetime-local"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; max-width: 100%; min-height: 46px; text-align: left; }
input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value, input[type="datetime-local"]::-webkit-date-and-time-value { text-align: left; }
.row.between { row-gap: 2px; }
.row.between > strong { min-width: 0; }
.origin { white-space: nowrap; }
.fieldrow { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
.sheet, .sheet-b { background: var(--bg); }
.ftin { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ftin select { min-height: 46px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 16px; width: 100%; }
.ex-note { color: var(--accent); font-weight: 550; }
.day-actions { margin-top: 2px; }
